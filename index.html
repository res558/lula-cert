<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado</title>
<script>
  // ===== CONFIG: ajuste aqui =====
  // X e Y são frações da imagem (0 = esquerda/topo, 1 = direita/base). 0.5 = centro.
  // FONT_SIZE é fração da LARGURA da imagem (0.04 = 4% da largura).
  const IMAGES = {
    1: { src: "certificado1.webp", X: 0.50, Y: 0.33, FONT_SIZE: 0.028, COLOR: "#1a1a1a" },
    2: { src: "certificado2.webp", X: 0.50, Y: 0.585, FONT_SIZE: 0.040, COLOR: "#1a1a1a" },
    3: { src: "certificado3.png", X: 0.50, Y: 0.530, FONT_SIZE: 0.040, COLOR: "#1a1a1a" }
  };
  const FONT_FAMILY = "Georgia, 'Times New Roman', serif";
  const MAX_CHARS = 60;
  const MAX_TEXT_WIDTH = 0.80; // texto nunca passa de 80% da largura da imagem (reduz a fonte se precisar)
  const DOWNLOAD_NAME = "certificado.png";
  const RESTORE_PANEL_AFTER_SAVE = true; // false = painel fica escondido depois de salvar
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ff0000;
    font-family: Arial, sans-serif;
  }
  #stage {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    display: inline-block;
    line-height: 0;
  }
  #cert {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    width: auto;
    height: auto;
  }
  #nameText {
    position: absolute;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    line-height: 1;
    pointer-events: none;
  }
  #panel {
    position: absolute;
    top: 80%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(90vw, 360px);
    box-sizing: border-box;
    background: #ffffff;
    border: 2px solid #000;
    padding: 20px;
    text-align: center;
    line-height: normal;
    display: none;
  }
  #panel h2 { margin: 0 0 12px; font-size: 20px; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 14px; }
  button {
    font-size: 16px;
    padding: 8px 16px;
    border: 1px solid #000;
    background: #eee;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  label { display: block; margin-bottom: 6px; }
  input[type=text] {
    font-size: 16px; /* 16px evita zoom automático no iPhone */
    padding: 6px;
    flex: 1 1 160px;
    min-width: 0;
  }

  /* Celular: painel fixo no rodapé da tela */
  @media (max-width: 700px) {
    #panel {
      position: fixed;
      top: auto;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      transform: none;
      border-width: 2px 0 0 0;
      padding: 14px;
    }
    #panel h2 { font-size: 18px; margin-bottom: 10px; }
    .row { margin-bottom: 10px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <img id="cert" alt="Certificado">
    <div id="nameText"></div>
    <div id="panel">
      <h2>Escolha seu certificado</h2>
      <div class="row">
        <button id="btn1">1</button>
        <button id="btn2">2</button>
        <button id="btn3">3</button>
      </div>
      <label for="nameInput">Escreva aqui nome</label>
      <div class="row">
        <input type="text" id="nameInput">
        <button id="applyBtn">Aplicar</button>
      </div>
      <button id="saveBtn" disabled>Salvar imagem</button>
    </div>
  </div>
</div>

<script>
  const img = document.getElementById("cert");
  const nameText = document.getElementById("nameText");
  const panel = document.getElementById("panel");
  const nameInput = document.getElementById("nameInput");
  const applyBtn = document.getElementById("applyBtn");
  const saveBtn = document.getElementById("saveBtn");
  const measureCtx = document.createElement("canvas").getContext("2d");

  nameInput.maxLength = MAX_CHARS;

  let current = 1;
  let appliedText = "";

  // Reduz a fonte se o texto ficar mais largo que maxWidth
  function fittedSize(text, baseSize, maxWidth) {
    measureCtx.font = baseSize + "px " + FONT_FAMILY;
    const textWidth = measureCtx.measureText(text).width;
    return textWidth > maxWidth ? baseSize * maxWidth / textWidth : baseSize;
  }

  function positionText() {
    const cfg = IMAGES[current];
    const w = img.clientWidth;
    const h = img.clientHeight;
    const size = fittedSize(appliedText, cfg.FONT_SIZE * w, MAX_TEXT_WIDTH * w);
    nameText.style.left = (cfg.X * w) + "px";
    nameText.style.top = (cfg.Y * h) + "px";
    nameText.style.fontSize = size + "px";
    nameText.style.fontFamily = FONT_FAMILY;
    nameText.style.color = cfg.COLOR;
  }

  function loadImage(n) {
    current = n;
    img.src = IMAGES[n].src;
  }

  img.addEventListener("load", positionText);
  window.addEventListener("resize", positionText);

  document.getElementById("btn1").addEventListener("click", () => loadImage(1));
  document.getElementById("btn2").addEventListener("click", () => loadImage(2));
  document.getElementById("btn3").addEventListener("click", () => loadImage(3));

  applyBtn.addEventListener("click", () => {
    appliedText = nameInput.value.slice(0, MAX_CHARS);
    nameText.textContent = appliedText;
    positionText();
    saveBtn.disabled = appliedText.trim() === "";
    nameInput.blur(); // fecha o teclado no celular
  });

  saveBtn.addEventListener("click", () => {
    panel.style.display = "none";

    const cfg = IMAGES[current];
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");

    ctx.drawImage(img, 0, 0, w, h);
    const size = fittedSize(appliedText, cfg.FONT_SIZE * w, MAX_TEXT_WIDTH * w);
    ctx.font = size + "px " + FONT_FAMILY;
    ctx.fillStyle = cfg.COLOR;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(appliedText, cfg.X * w, cfg.Y * h);

    try {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.download = DOWNLOAD_NAME;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        if (RESTORE_PANEL_AFTER_SAVE) panel.style.display = "block";
      }, "image/png");
    } catch (e) {
      alert("Não foi possível salvar. Abra a página por um servidor (http://), não por file://.");
      if (RESTORE_PANEL_AFTER_SAVE) panel.style.display = "block";
    }
  });

  // Start: load image 1, show panel only after everything is loaded
  window.addEventListener("load", () => {
    loadImage(1);
    if (img.complete) { positionText(); panel.style.display = "block"; }
    else img.addEventListener("load", () => { panel.style.display = "block"; }, { once: true });
  });
</script>
</body>
</html>
