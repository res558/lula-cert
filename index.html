<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado Exército do Lula</title>
<!-- Prévia do link no WhatsApp/Facebook/X (endereços precisam ser completos) -->
<meta name="description" content="Faça o seu certificado do Exército do Lula com o seu nome. Grátis, em segundos.">

<meta property="og:title" content="Certificado Exército do Lula">

<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<script>
  // ===== CONFIG: ajuste aqui =====
  // X e Y são frações da imagem (0 = esquerda/topo, 1 = direita/base). 0.5 = centro.
  // FONT_SIZE é fração da LARGURA da imagem (0.04 = 4% da largura).
  // SIGNATURE (opcional): assinatura com o mesmo nome, em fonte cursiva. Só quem tiver SIGNATURE ganha assinatura.
  // MAX_WIDTH da assinatura: largura máxima (fração da imagem) — reduz a fonte se o nome for longo.
  const SIGNATURE_FONT = "'Mrs Saint Delafield', cursive";

  const IMAGES = {
    1: { src: "certificado1.webp", X: 0.50, Y: 0.33, FONT_SIZE: 0.028, COLOR: "#1a1a1a" },
    2: { src: "certificado2.webp", X: 0.50, Y: 0.585, FONT_SIZE: 0.040, COLOR: "#1a1a1a",
         SIGNATURE: { X: 0.50, Y: 0.895, FONT_SIZE: 0.050, COLOR: "#1f3a93", MAX_WIDTH: 0.24 } },
    3: { src: "certificado3.png", X: 0.50, Y: 0.530, FONT_SIZE: 0.040, COLOR: "#1a1a1a" }
  };
  const FONT_FAMILY = "Georgia, 'Times New Roman', serif";
  const MAX_CHARS = 60;
  const MAX_TEXT_WIDTH = 0.80; // texto nunca passa de 80% da largura da imagem (reduz a fonte se precisar)
  const DOWNLOAD_PREFIX = "certificado"; // arquivo salvo: certificado-maria-da-silva.png
  const RESTORE_PANEL_AFTER_SAVE = true; // false = painel fica escondido depois de salvar
  const SHARE_TEXT = "Faça o seu certificado do Exército do Lula:"; // texto que vai junto com o link ao compartilhar

  // Estrelas do fundo
  const STAR_COUNT = 15;
  const STAR_MIN_SIZE = 200;      // px
  const STAR_MAX_SIZE = 450;      // px
  const STAR_MIN_OPACITY = 0.10;  // 90% de transparência
  const STAR_MAX_OPACITY = 0.40;  // 60% de transparência
  const STAR_COLOR = "#FFD700";
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ff0000;
    font-family: Arial, sans-serif;
  }
  #feedback {
    z-index: 2;
    color: #000000;
    font-size: 10px;
    text-decoration: none;
    white-space: nowrap;
	bottom: 0;
	position: fixed;
	left: 0;
	right: 0;
  }
  #feedback:hover { color: #ff0000; }
  #stars { 	
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .star {
    position: absolute;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  #stage {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    display: inline-block;
    line-height: 0;
  }
  #cert {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    width: auto;
    height: auto;
  }
  #nameText, #signText {
    position: absolute;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    line-height: 1;
    pointer-events: none;
  }
  #signText { display: none; }
  #panel {
    position: absolute;
    top: 80%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(90vw, 360px);
    box-sizing: border-box;
    background: #ffffff;
    border: 2px solid #000;
    padding: 32px 20px 20px;
    text-align: center;
    line-height: normal;
    display: none;
  }
  #panel h2 { margin: 0 0 12px; font-size: 20px; }

  /* Compartilhar: ícones de linha no canto superior direito do painel */
  #share {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    gap: 2px;
    line-height: 0;
  }
  #share a { display: block; padding: 3px; color: #000; }
  #share a:hover, #share a:focus-visible { color: #ff0000; }
  #share svg {
    width: 18px; height: 18px;
    fill: none; stroke: currentColor; stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 14px; }
  button {
    font-size: 16px;
    padding: 8px 16px;
    border: 1px solid #000;
    background: #eee;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  button.selected { background: #000; color: #fff; } /* modelo escolhido */
  label { display: block; margin-bottom: 6px; font-weight: bold; }
  .note { margin: 8px 0 0; font-size: 12px; color: #555; }
  #inAppTip { display: none; color: #000; }

  /* Tela cheia com o certificado pronto (celular sem menu de compartilhar) */
  #viewer {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
    box-sizing: border-box;
    text-align: center;
    font-size: 18px;
    color: #fff;
  }
  #viewer[hidden] { display: none; }
  #viewer p { margin: 0; font-weight: bold; }
  #viewerImg {
    max-width: 100%;
    max-height: calc(100dvh - 130px);
    object-fit: contain;
    -webkit-touch-callout: default;
  }
  input[type=text] {
    font-size: 16px; /* 16px evita zoom automático no iPhone */
    padding: 6px;
    flex: 1 1 160px;
    min-width: 0;
  }

  /* Celular: painel fixo no rodapé da tela */
  @media (max-width: 700px) {
    #panel {
      position: fixed;
      top: auto;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      transform: none;
      border-width: 2px 0 0 0;
      padding: 34px 14px 14px;
    }
    #share svg { width: 22px; height: 22px; } /* maior para o dedo */
    #panel h2 { font-size: 18px; margin-bottom: 10px; }
    .row { margin-bottom: 10px; }
  }
</style>
</head>
<body>
<div id="stars"></div>
<div id="stage">
  <div id="wrap">
    <img id="cert" alt="Certificado">
    <div id="nameText"></div>
    <div id="signText"></div>
    <div id="panel">
      <div id="share" aria-label="Compartilhar">
        <a data-net="whatsapp" title="WhatsApp" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg></a>
        <a data-net="facebook" title="Facebook" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M7 10v4h3v7h4v-7h3l1-4h-4V8a1 1 0 0 1 1-1h3V3h-3a5 5 0 0 0-5 5v2H7"/></svg></a>
        <a data-net="instagram" href="#" title="Instagram"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.5"/><path d="M16.5 7.5v.01"/></svg></a>
        <a data-net="x" title="X" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M4 4l11.733 16H20L8.267 4z"/><path d="M4 20l6.768-6.768m2.46-2.46L20 4"/></svg></a>
        <a data-net="telegram" title="Telegram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M15 10l-4 4l6 6l4-16l-18 7l4 2l2 6l3-4"/></svg></a>
        <a data-net="more" href="#" title="Mais opções"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.7 10.7l6.6-3.4M8.7 13.3l6.6 3.4"/></svg></a>
      </div>
      <h2>1. Escolha o modelo</h2>
      <div class="row">
        <button id="btn1" class="selected">1</button>
        <button id="btn2">2</button>
        <button id="btn3">3</button>
      </div>
      <label for="nameInput">2. Digite seu nome</label>
      <div class="row">
        <input type="text" id="nameInput" autocomplete="name" autocapitalize="words" enterkeyhint="done" placeholder="Ex.: Maria da Silva">
      </div>
      <button data-goatcounter-click="salvar-imagem" id="saveBtn" disabled>3. Salvar imagem</button>
      <p class="note">Seu nome fica só no seu aparelho. Nada é enviado.</p>
      <p class="note" id="inAppTip">Se não salvar, toque em ⋮ ou ••• e escolha "Abrir no navegador".</p>
	  <br/>
	  <a id="feedback" href="https://github.com/res558/lula-cert/issues" target="_blank" rel="noopener">Sugestões e pedidos aqui</a>
    </div>
  </div>
</div>

<!-- Certificado pronto em tela cheia: fallback para celulares sem menu de compartilhar -->
<div id="viewer" hidden>
  <p>Toque e segure na imagem para salvar</p>
  <img id="viewerImg" alt="Seu certificado">
  <button id="viewerClose">Fechar</button>
</div>

<script>
  const img = document.getElementById("cert");
  const nameText = document.getElementById("nameText");
  const signText = document.getElementById("signText");
  const panel = document.getElementById("panel");
  const nameInput = document.getElementById("nameInput");
  const saveBtn = document.getElementById("saveBtn");
  const measureCtx = document.createElement("canvas").getContext("2d");

  nameInput.maxLength = MAX_CHARS;

  // Gera estrelas douradas no fundo: a tela é dividida numa grade,
  // uma estrela por célula, posição aleatória dentro da célula => sem sobreposição e bem distribuídas
  function makeStars() {
    const layer = document.getElementById("stars");
    layer.innerHTML = "";
    const W = window.innerWidth;
    const H = window.innerHeight;
    const cols = Math.max(1, Math.round(Math.sqrt(STAR_COUNT * W / H)));
    const rows = Math.max(1, Math.ceil(STAR_COUNT / cols));
    const cellW = W / cols;
    const cellH = H / rows;
    const maxFit = Math.min(cellW, cellH) * 0.95; // estrela nunca sai da própria célula

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const wanted = STAR_MIN_SIZE + Math.random() * (STAR_MAX_SIZE - STAR_MIN_SIZE);
        const size = Math.min(wanted, maxFit);
        const cx = c * cellW + size / 2 + Math.random() * (cellW - size);
        const cy = r * cellH + size / 2 + Math.random() * (cellH - size);

        const s = document.createElement("div");
        s.className = "star";
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.left = cx + "px";
        s.style.top = cy + "px";
        s.style.background = STAR_COLOR;
        s.style.opacity = STAR_MIN_OPACITY + Math.random() * (STAR_MAX_OPACITY - STAR_MIN_OPACITY);
        s.style.transform = "translate(-50%, -50%) rotate(" + (Math.random() * 72) + "deg)";
        layer.appendChild(s);
      }
    }
  }
  makeStars();

  // Refaz as estrelas quando a tela muda de tamanho (ou o celular gira)
  let starTimer;
  let lastW = window.innerWidth;
  window.addEventListener("resize", () => {
    if (window.innerWidth === lastW) return; // ignora a barra do navegador no celular aparecendo/sumindo
    lastW = window.innerWidth;
    clearTimeout(starTimer);
    starTimer = setTimeout(makeStars, 200);
  });

  let current = 1;
  let appliedText = "";

  // Reduz a fonte se o texto ficar mais largo que maxWidth
  function fittedSize(text, baseSize, maxWidth, family) {
    measureCtx.font = baseSize + "px " + family;
    const textWidth = measureCtx.measureText(text).width;
    return textWidth > maxWidth ? baseSize * maxWidth / textWidth : baseSize;
  }

  // Posiciona um texto HTML sobre a imagem
  function placeText(el, spec, family, maxWidthFrac, w, h) {
    const size = fittedSize(appliedText, spec.FONT_SIZE * w, maxWidthFrac * w, family);
    el.style.left = (spec.X * w) + "px";
    el.style.top = (spec.Y * h) + "px";
    el.style.fontSize = size + "px";
    el.style.fontFamily = family;
    el.style.color = spec.COLOR;
  }

  // Desenha um texto no canvas (imagem final)
  function drawText(ctx, spec, family, maxWidthFrac, w, h) {
    const size = fittedSize(appliedText, spec.FONT_SIZE * w, maxWidthFrac * w, family);
    ctx.font = size + "px " + family;
    ctx.fillStyle = spec.COLOR;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(appliedText, spec.X * w, spec.Y * h);
  }

  function positionText() {
    const cfg = IMAGES[current];
    const w = img.clientWidth;
    const h = img.clientHeight;
    placeText(nameText, cfg, FONT_FAMILY, MAX_TEXT_WIDTH, w, h);

    if (cfg.SIGNATURE) {
      signText.textContent = appliedText;
      signText.style.display = "block";
      placeText(signText, cfg.SIGNATURE, SIGNATURE_FONT, cfg.SIGNATURE.MAX_WIDTH, w, h);
    } else {
      signText.style.display = "none";
    }
  }

  function loadImage(n) {
    current = n;
    img.src = IMAGES[n].src;
    // Destaca o botão do modelo escolhido
    Object.keys(IMAGES).forEach((i) => {
      document.getElementById("btn" + i).classList.toggle("selected", Number(i) === n);
    });
  }

  img.addEventListener("load", () => { positionText(); schedulePrepare(); });
  window.addEventListener("resize", positionText);
  // Reposiciona quando a fonte da assinatura terminar de carregar (medidas mudam)
  document.fonts.load("40px " + SIGNATURE_FONT).then(() => { positionText(); schedulePrepare(); }).catch(() => {});

  document.getElementById("btn1").addEventListener("click", () => loadImage(1));
  document.getElementById("btn2").addEventListener("click", () => loadImage(2));
  document.getElementById("btn3").addEventListener("click", () => loadImage(3));

  // O nome vai para o certificado enquanto a pessoa digita
  function applyName() {
    appliedText = nameInput.value.slice(0, MAX_CHARS);
    nameText.textContent = appliedText;
    positionText();
    saveBtn.disabled = appliedText.trim() === "";
    schedulePrepare();
  }
  nameInput.addEventListener("input", applyName);
  // Enter / "OK" no celular: fecha o teclado
  nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") nameInput.blur(); });

  // ===== Salvar =====
  // Celular: abre o menu de compartilhar com a própria imagem (Salvar na galeria, WhatsApp, Instagram...).
  //          Se o menu não existir ou for bloqueado: mostra a imagem em tela cheia para "tocar e segurar".
  // PC: baixa o arquivo, como antes.
  const IS_PHONE = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  const IN_APP = /FBAN|FBAV|FB_IAB|FBIOS|Instagram/i.test(navigator.userAgent); // navegador do Facebook/Instagram
  if (IN_APP) document.getElementById("inAppTip").style.display = "block";

  const viewer = document.getElementById("viewer");
  const viewerImg = document.getElementById("viewerImg");
  document.getElementById("viewerClose").addEventListener("click", () => {
    viewer.hidden = true;
    viewerImg.removeAttribute("src");
  });

  // "Maria da Silva" -> certificado-maria-da-silva.png
  function fileName() {
    const slug = appliedText.normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
    return DOWNLOAD_PREFIX + (slug ? "-" + slug : "") + ".png";
  }

  // Só a imagem do certificado + textos (fundo, estrelas e links não entram)
  async function buildCanvas() {
    const cfg = IMAGES[current];
    if (!img.complete) await new Promise((r) => img.addEventListener("load", r, { once: true }));
    if (cfg.SIGNATURE) {
      try { await document.fonts.load("40px " + SIGNATURE_FONT, appliedText); } catch (e) {}
    }
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);
    drawText(ctx, cfg, FONT_FAMILY, MAX_TEXT_WIDTH, w, h);
    if (cfg.SIGNATURE) drawText(ctx, cfg.SIGNATURE, SIGNATURE_FONT, cfg.SIGNATURE.MAX_WIDTH, w, h);
    return canvas;
  }

  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {
      try { canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("toBlob"))), "image/png"); }
      catch (e) { reject(e); }
    });
  }

  // Celular: deixa a imagem pronta ANTES do clique. O menu de compartilhar só abre
  // se for chamado logo depois do toque (no iPhone é ~1 segundo), sem tempo para gerar o PNG.
  let ready = null; // { key, file }
  let prepTimer;
  const currentKey = () => current + "|" + appliedText;
  function schedulePrepare() {
    if (!IS_PHONE || !navigator.canShare) return;
    ready = null;
    clearTimeout(prepTimer);
    if (appliedText.trim() === "") return;
    prepTimer = setTimeout(async () => {
      const key = currentKey();
      try {
        const blob = await canvasToBlob(await buildCanvas());
        if (key === currentKey()) ready = { key, file: new File([blob], fileName(), { type: "image/png" }) };
      } catch (e) {}
    }, 400);
  }

  function saved(mode) {
    window.goatcounter?.count({ path: "download-ok-cert" + current, title: "Download cert " + current, event: true });
    window.goatcounter?.count({ path: "save-" + mode, title: "Salvar via " + mode, event: true });
    if (!RESTORE_PANEL_AFTER_SAVE) panel.style.display = "none";
  }

  async function showViewer() {
    viewerImg.src = (await buildCanvas()).toDataURL("image/png");
    viewer.hidden = false;
    saved("viewer");
  }

  async function downloadFile() {
    const url = URL.createObjectURL(await canvasToBlob(await buildCanvas()));
    const a = document.createElement("a");
    a.download = fileName();
    a.href = url;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    saved("download");
  }

  saveBtn.addEventListener("click", async () => {
    if (appliedText.trim() === "") return;
    try {
      if (!IS_PHONE) return await downloadFile(); // PC: igual a antes

      let file = ready && ready.key === currentKey() ? ready.file : null;
      if (!file && navigator.canShare) {
        file = new File([await canvasToBlob(await buildCanvas())], fileName(), { type: "image/png" });
      }
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
          saved("share");
        } catch (e) {
          if (e.name !== "AbortError") await showViewer(); // bloqueado: tela cheia
          // AbortError = a pessoa só fechou o menu
        }
        return;
      }
      await showViewer(); // celular sem menu de compartilhar
    } catch (e) {
      alert("Não foi possível salvar. Abra a página por um servidor (http://), não por file://.");
    }
  });

  // Compartilhar: monta os links com o endereço desta página
  const shareUrl = location.origin + location.pathname;
  const enc = encodeURIComponent;
  const SHARE_LINKS = {
    whatsapp: "https://wa.me/?text=" + enc(SHARE_TEXT + " " + shareUrl),
    facebook: "https://www.facebook.com/sharer/sharer.php?u=" + enc(shareUrl),
    x:        "https://twitter.com/intent/tweet?text=" + enc(SHARE_TEXT) + "&url=" + enc(shareUrl),
    telegram: "https://t.me/share/url?url=" + enc(shareUrl) + "&text=" + enc(SHARE_TEXT)
  };
  document.querySelectorAll("#share a").forEach((a) => {
    const net = a.dataset.net;
    if (SHARE_LINKS[net]) a.href = SHARE_LINKS[net];
    a.addEventListener("click", async (e) => {
      window.goatcounter?.count({ path: "share-" + net, title: "Share " + net, event: true });
      if (net !== "more" && net !== "instagram") return;
      e.preventDefault();
      // Celular: abre o menu nativo do sistema (lá aparecem Instagram, e-mail, etc.)
      if (navigator.share) {
        try { await navigator.share({ text: SHARE_TEXT, url: shareUrl }); } catch (err) {}
        return;
      }
      // PC: copia o link; no Instagram também abre o site (ele não tem link de compartilhar)
      if (net === "instagram") window.open("https://www.instagram.com/", "_blank", "noopener");
      try { await navigator.clipboard.writeText(shareUrl); alert("Link copiado!"); } catch (err) {}
    });
  });

  // Start: load image 1, show panel only after everything is loaded
  window.addEventListener("load", () => {
    loadImage(1);
    applyName(); // caso o navegador tenha preenchido o campo sozinho (ex.: botão Voltar)
    if (img.complete) { positionText(); panel.style.display = "block"; }
    else img.addEventListener("load", () => { panel.style.display = "block"; }, { once: true });
  });
</script>
